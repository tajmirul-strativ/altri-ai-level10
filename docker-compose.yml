services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: l10
      POSTGRES_PASSWORD: l10
      POSTGRES_DB: l10
    ports:
      - "5433:5432"   # 5433 on the host, so it doesn't clash with a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l10 -d l10"]
      interval: 2s
      timeout: 3s
      retries: 30

  # API: migrates, loads the seed (safe to rerun), then serves on :8000 (docs at /api/docs).
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://l10:l10@db:5432/l10
      APP_NOW: ${APP_NOW:-2026-11-11T15:00:00Z}
      CLOCK_MODE: ${CLOCK_MODE:-running}
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-secret-change-me}
    volumes:
      - ./docs:/docs:ro   # seed.json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.cli seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Web app on :3000. Proxies /api to the backend, so the browser sees one origin.
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Runs the backend test suite against the db service: `make test`
  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://l10:l10@db:5432/l10_test
    volumes:
      - ./docs:/docs:ro   # seed.json
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "pytest"]

  # Two-browser end-to-end test against the running stack: `make test`
  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: e2e.Dockerfile
    environment:
      E2E_BASE_URL: http://frontend:3000
    volumes:
      - ./frontend/test-results:/e2e/test-results   # traces of failed tests
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  db-data:
